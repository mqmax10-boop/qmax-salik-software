<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Qmax & Salik Software</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d31;--line:#293651;--text:#f4f7ff;--muted:#aab6ce;--accent:#49d6b0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0b1020,#101a2d);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}header{padding:28px 16px;text-align:center;background:#101a2d;border-bottom:1px solid var(--line)}h1{margin:0 0 8px;font-size:clamp(24px,5vw,36px)}header p{color:var(--muted);margin:0}.wrap{max-width:1100px;margin:auto;padding:20px 14px}.tools{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:18px}@media(min-width:650px){.tools{grid-template-columns:2fr 1fr}}input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font:inherit}.status{color:var(--muted);margin:10px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.card img{width:100%;height:170px;object-fit:cover;background:#0c1323}.inside{padding:15px}.inside h2{font-size:20px;margin:0 0 8px}.inside p{color:var(--muted);white-space:pre-wrap;line-height:1.7}.links{display:flex;flex-wrap:wrap;gap:8px}.links a,.admin{display:inline-block;background:var(--accent);color:#06271f;text-decoration:none;font-weight:700;padding:9px 12px;border-radius:10px}.admin{margin-top:24px}footer{text-align:center;padding:25px;color:var(--muted)}.empty{padding:20px;background:var(--panel);border-radius:12px;color:var(--muted)}
</style></head><body>
<header><h1>Qmax & Salik Software</h1><p>ملفات الفلاش والدامب واللودر والشروحات</p></header>
<main class="wrap"><div class="tools"><input id="search" placeholder="ابحث باسم الجهاز أو الموديل..."><select id="category"><option value="">كل الأقسام</option><option>فلاش ودامب</option><option>فلاش</option><option>دامب</option><option>لودر</option><option>شرح</option></select></div><div id="status" class="status">جارٍ تحميل الموديلات...</div><div id="cards" class="cards"></div><a class="admin" href="admin.html">دخول لوحة المدير</a></main><footer>Qmax & Salik Software</footer>
<script>
// ضع Publishable key العامة من Supabase هنا. لا تستخدم secret أو service_role key.
const SUPABASE_URL='https://gcaugfjrpyfzwhzkbxtw.supabase.co';
const SUPABASE_KEY='PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE';
const cards=document.getElementById('cards'),statusEl=document.getElementById('status');let models=[];
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function urlLink(url,label){if(!url)return '';try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))return '';return `<a href="${esc(u.href)}" target="_blank" rel="noopener noreferrer">${label}</a>`}catch{return ''}}
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),cat=document.getElementById('category').value;const filtered=models.filter(m=>(!cat||m.category===cat)&&[m.name,m.description,m.category].some(v=>String(v||'').toLowerCase().includes(q)));cards.innerHTML=filtered.map(m=>`<article class="card">${m.image_url?`<img src="${esc(m.image_url)}" alt="${esc(m.name)}" loading="lazy" onerror="this.style.display='none'">`:''}<div class="inside"><h2>${esc(m.name)}</h2><small>${esc(m.category||'فلاش ودامب')}</small><p>${esc(m.description||'')}</p><div class="links">${urlLink(m.flash_link,'تحميل الفلاشة')}${urlLink(m.dump_link,'تحميل الدامب')}${urlLink(m.loader_link,'تحميل اللودر')}</div></div></article>`).join('');if(!filtered.length)cards.innerHTML='<div class="empty">لا توجد موديلات مطابقة للبحث حاليًا.</div>';statusEl.textContent=`عدد الموديلات: ${filtered.length}`;}
async function load(){if(SUPABASE_KEY.includes('PASTE_YOUR')){statusEl.textContent='يلزم وضع Publishable key العامة في ملف index.html أولًا.';return}try{const r=await fetch(`${SUPABASE_URL}/rest/v1/models?select=*&published=eq.true&order=created_at.desc`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});if(!r.ok)throw Error(`HTTP ${r.status}: ${await r.text()}`);models=await r.json();render()}catch(e){statusEl.textContent='تعذر تحميل البيانات. راجع المفتاح وسياسات القراءة في Supabase.';console.error(e)}}document.getElementById('search').addEventListener('input',render);document.getElementById('category').addEventListener('change',render);load();
</script></body></html>
