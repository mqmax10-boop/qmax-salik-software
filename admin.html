<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>لوحة إدارة Qmax & Salik</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d31;--line:#293651;--text:#f4f7ff;--muted:#aab6ce;--accent:#49d6b0;--danger:#ff7272}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Tahoma,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}h1{font-size:26px}section{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin:14px 0}input,textarea,select{width:100%;padding:11px;margin:5px 0 12px;border:1px solid var(--line);border-radius:9px;background:#0d1527;color:var(--text);font:inherit}textarea{min-height:85px}label{display:block;color:var(--muted)}button,.link{border:0;border-radius:9px;background:var(--accent);color:#06271f;font:inherit;font-weight:700;padding:10px 14px;cursor:pointer;margin:3px;text-decoration:none;display:inline-block}.danger{background:var(--danger)}.muted{color:var(--muted)}.item{border-top:1px solid var(--line);padding:12px 0}.hidden{display:none}.row{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:600px){.row{grid-template-columns:1fr 1fr}}#message{white-space:pre-wrap;overflow-wrap:anywhere}.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* Modern Qmax & Salik admin refresh */
:root{color-scheme:dark;--bg:#080d19;--panel:#111a2c;--line:#273750;--text:#f3f7ff;--muted:#a4b3cc;--accent:#38e0b5;--danger:#ff747f}
body{background:radial-gradient(ellipse at 10% 0%,rgba(56,224,181,.12),transparent 35%),radial-gradient(ellipse at 95% 15%,rgba(109,124,255,.14),transparent 30%),#080d19;color:var(--text)}
.wrap{max-width:980px;padding:22px 16px}h1{letter-spacing:.2px}.top{gap:12px}section{background:linear-gradient(155deg,rgba(19,30,51,.98),rgba(13,21,37,.98));border-color:rgba(103,128,165,.26);border-radius:20px;padding:20px;box-shadow:0 12px 32px rgba(0,0,0,.18)}input,textarea,select{background:#0b1322;border-color:#2c3d5a;border-radius:12px;transition:border-color .2s,box-shadow .2s}input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,224,181,.12)}label{font-size:14px;margin-top:4px}button,.link{background:linear-gradient(135deg,#48e6bd,#29cba5);border-radius:11px;padding:11px 16px;transition:filter .2s,transform .2s}button:hover,.link:hover{filter:brightness(1.08);transform:translateY(-1px)}button.danger,.danger{background:linear-gradient(135deg,#ff858d,#ef596b);color:#310b12}.item{border-top:1px solid rgba(103,128,165,.2);padding:15px 0}.muted{color:#a4b3cc}#message{padding:8px 0;line-height:1.8}

</style></head><body><main class="wrap"><div class="top"><h1>لوحة إدارة Qmax & Salik</h1><a class="link" href="index.html">العودة للموقع</a></div><p class="muted">سجّل الدخول بحساب المدير الذي أنشأته في Supabase Authentication.</p><div id="message" role="status" class="muted"></div>
<section id="loginBox"><h2>تسجيل الدخول</h2><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">دخول</button></section>
<div id="app" class="hidden"><section><div class="top"><h2 id="formTitle">إضافة موديل</h2><button id="logoutBtn" class="danger">تسجيل الخروج</button></div><form id="modelForm"><input id="modelId" type="hidden"><label>اسم الجهاز / الموديل *</label><input id="name" required><div class="row"><div><label>القسم</label><select id="category"><option>فلاش</option><option value="دامب">ملفات قنوات</option><option>لودر</option><option value="شرح">سوفتوير</option></select></div><div><label>رابط الصورة (اختياري)</label><input id="image_url" type="url" placeholder="https://..."></div></div><label>الوصف</label><textarea id="description"></textarea><label>رابط الفلاشة</label><input id="flash_link" type="url" placeholder="https://www.mediafire.com/..."><label>رابط السوفتوير</label><input id="software_link" type="url" placeholder="https://..."><label>رابط ملفات القنوات</label><input id="channel_files_link" type="url" placeholder="https://www.mediafire.com/..."><label>رابط اللودر</label><input id="loader_link" type="url" placeholder="https://..."><label><input id="published" type="checkbox" checked style="width:auto"> منشور للزوار</label><button type="submit">حفظ الموديل</button><button type="button" id="resetBtn">تفريغ الحقول</button></form></section><section><div class="top"><h2>الموديلات</h2><button id="refreshBtn">تحديث القائمة</button></div><div id="list"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// استخدم Publishable key العامة فقط. لا تضع secret أو service_role key في ملفات الموقع.
const SUPABASE_URL='https://gcaugfjrpyfzwhzkbxtw.supabase.co';
const SUPABASE_KEY='sb_publishable_go0cIktl1AHW-d1H2h3egA_68VtjZ9D';
const message=document.getElementById('message');let sb=null;
function say(s){message.textContent=s}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function init(){if(SUPABASE_KEY.includes('PASTE_YOUR')){say('قبل الاستخدام: افتح admin.html وindex.html وابحث عن sb_publishable_go0cIktl1AHW-d1H2h3egA_68VtjZ9D واستبدله بالمفتاح Publishable العام من Supabase.');document.getElementById('loginBtn').disabled=true;return false}if(!window.supabase){say('تعذر تحميل مكتبة Supabase. تحقق من الاتصال بالإنترنت.');return false}sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return true}
function formData(){return {name:document.getElementById('name').value.trim(),category:document.getElementById('category').value,description:document.getElementById('description').value.trim(),image_url:document.getElementById('image_url').value.trim(),flash_link:document.getElementById('flash_link').value.trim(),software_link:document.getElementById('software_link').value.trim(),channel_files_link:document.getElementById('channel_files_link').value.trim(),loader_link:document.getElementById('loader_link').value.trim(),published:document.getElementById('published').checked}}
function resetForm(){document.getElementById('modelForm').reset();document.getElementById('modelId').value='';document.getElementById('published').checked=true;document.getElementById('formTitle').textContent='إضافة موديل'}
async function showApp(){document.getElementById('loginBox').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await loadModels()}
async function loadModels(){say('جارٍ تحميل الموديلات...');const {data,error}=await sb.from('models').select('*').order('created_at',{ascending:false});if(error){say('فشل تحميل الموديلات: '+error.message);return}const list=document.getElementById('list');list.innerHTML=data.length?data.map(m=>`<div class="item"><strong>${esc(m.name)}</strong> — ${esc(({ 'دامب':'ملفات قنوات', 'شرح':'سوفتوير' })[m.category]||m.category||'')}<p class="muted">${m.published?'منشور':'غير منشور'}</p><button data-edit="${m.id}">تعديل</button><button class="danger" data-delete="${m.id}">حذف</button></div>`).join(''):'لا توجد موديلات بعد.';list.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>editModel(data.find(m=>String(m.id)===b.dataset.edit))));list.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>deleteModel(b.dataset.delete)));say('تم تحميل '+data.length+' موديل.')}
function editModel(m){if(!m)return;document.getElementById('modelId').value=m.id;for(const k of ['name','category','description','image_url','flash_link','software_link','channel_files_link','loader_link','published']){const el=document.getElementById(k);if(k==='published')el.checked=!!m[k];else el.value=(k==='category'&&m[k]==='فلاش ودامب')?'فلاش':(m[k]??'')}document.getElementById('formTitle').textContent='تعديل موديل';window.scrollTo({top:0,behavior:'smooth'})}
async function deleteModel(id){if(!confirm('هل تريد حذف هذا الموديل نهائيًا؟'))return;const {error}=await sb.from('models').delete().eq('id',id);if(error){say('فشل الحذف: '+error.message);return}say('تم حذف الموديل.');await loadModels()}
document.getElementById('loginBtn').addEventListener('click',async()=>{if(!sb)return;const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){say('اكتب البريد الإلكتروني وكلمة المرور.');return}say('جارٍ تسجيل الدخول...');const {error}=await sb.auth.signInWithPassword({email,password});if(error){say('فشل تسجيل الدخول: '+error.message);return}await showApp()});
document.getElementById('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();document.getElementById('app').classList.add('hidden');document.getElementById('loginBox').classList.remove('hidden');say('تم تسجيل الخروج.')});
document.getElementById('modelForm').addEventListener('submit',async e=>{e.preventDefault();const item=formData();if(!item.name){say('اكتب اسم الموديل.');return}const id=document.getElementById('modelId').value;say('جارٍ الحفظ...');const result=id?await sb.from('models').update(item).eq('id',id):await sb.from('models').insert(item);if(result.error){say('تعذر الحفظ: '+result.error.message+' — تأكد من سياسات RLS وحساب المدير في Supabase.');return}say('تم الحفظ بنجاح.');resetForm();await loadModels()});
document.getElementById('resetBtn').addEventListener('click',resetForm);document.getElementById('refreshBtn').addEventListener('click',loadModels);
if(init()){sb.auth.getSession().then(({data})=>{if(data.session)showApp()})}
</script></body></html>
